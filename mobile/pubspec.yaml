name: lifebase_mobile
description: LifeBase selection-first Android application.
publish_to: none
version: 2.0.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.0.0
  dio: ^5.9.0
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  go_router: ^17.0.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  uuid: ^4.5.2
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  drift_dev: ^2.30.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
