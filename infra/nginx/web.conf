# The Flutter web app and the API on one origin (no CORS), inside the web container.
upstream lifebase_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://lifebase_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://lifebase_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # A new build must reach the browser at once; hashed assets are fine to keep.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
